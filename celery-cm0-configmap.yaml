  README.md: "# Match Prediction System\n\nA comprehensive Django-based match prediction system with user authentication, payment verification, two-star predictions, and leaderboard functionality.\n\n## Features\n\n- **User Management**: Registration, login with payment verification\n- **Match Management**: Create, schedule, and manage matches with tournaments\n- **Prediction System**: Submit predictions with 5-minute lock rule\n- **Two-Star Feature**: High-stakes predictions with doubled points\n- **Scoring Algorithm**: Exact (7pts), one correct (5pts), winner only (2pts)\n- **Leaderboard**: Real-time rankings with detailed statistics\n- **Admin Panel**: Complete admin control over users, matches, and settings\n- **Bulk Import**: CSV-based match and tournament import\n- **API Documentation**: Full OpenAPI/Swagger documentation\n\n## Tech Stack\n\n- **Backend**: Django 4.2 + Django REST Framework\n- **Database**: PostgreSQL\n- **Task Queue**: Celery + Redis\n- **Frontend**: React 18 (planned)\n- **Authentication**: Token-based auth\n- **Documentation**: OpenAPI/Swagger\n\n## Quick Start\n\n### Prerequisites\n\n- Python 3.8+\n- PostgreSQL 12+\n- Redis 6+\n- Node.js 16+ (for frontend)\n\n### Installation\n\n1. **Clone and setup environment**\n   ```bash\n   git clone <repository-url>\n   cd prediction\n   cp .env.example .env\n   # Edit .env with your configuration\n   ```\n\n2. **Install dependencies**\n   ```bash\n   pip install -r requirements.txt\n   ```\n\n3. **Database setup**\n   ```bash\n   # Create PostgreSQL database\n   createdb prediction_db\n   \n   # Run migrations\n   python manage.py makemigrations\n   python manage.py migrate\n   ```\n\n4. **Create admin user**\n   ```bash\n   python manage.py create_admin --username admin --email admin@example.com\n   ```\n\n5. **Start services**\n   ```bash\n   # Start Redis\n   redis-server\n   \n   # Start Celery worker (in separate terminal)\n   celery -A prediction worker --loglevel=info\n   \n   # Start Django development server\n   python manage.py runserver\n   ```\n\n6. **Access the application**\n   - API: http://localhost:8000/api/\n   - Admin: http://localhost:8000/admin/\n   - API Docs: http://localhost:8000/api/docs/\n\n## API Endpoints\n\n### Authentication\n- `POST /api/auth/register/` - User registration\n- `POST /api/auth/login/` - User login\n- `POST /api/auth/logout/` - User logout\n- `GET /api/auth/profile/` - User profile\n\n### Matches\n- `GET /api/matches/` - List matches\n- `GET /api/matches/{id}/` - Match details\n- `GET /api/matches/upcoming/` - Upcoming matches\n\n### Predictions\n- `POST /api/predictions/matches/{id}/` - Create prediction\n- `PUT /api/predictions/{id}/update/` - Update prediction\n- `GET /api/predictions/my/` - My predictions\n- `GET /api/predictions/two-star-status/` - Two-star usage status\n\n### Leaderboard\n- `GET /api/leaderboard/` - Leaderboard\n- `GET /api/leaderboard/my-stats/` - User statistics\n\n### Admin\n- `GET /api/admin/dashboard/` - Admin dashboard\n- `POST /api/admin/users/{id}/mark-paid/` - Mark user as paid\n- `POST /api/admin/matches/` - Create match\n- `POST /api/admin/matches/{id}/finish/` - Finish match and award points\n\n## Scoring Rules\n\n- **Exact Score**: 7 points\n- **One Score Correct**: 5 points  \n- **Correct Winner Only**: 2 points\n- **Completely Wrong**: 0 points\n- **Two-Star Multiplier**: 2x points if base points > 0\n\n## Two-Star Feature\n\nUsers can mark predictions as \"Two-Star\" to double their points, with limits:\n- Default: 3 per tournament\n- Default: 10 globally\n- Configurable via admin panel\n\n## Prediction Locking\n\n- Predictions lock 5 minutes before match start (configurable)\n- Admin can override locking per match\n- Once locked, predictions cannot be edited or deleted\n\n## Admin Features\n\n- User management and payment verification\n- Match creation and bulk import\n- Tournament management\n- Two-star configuration\n- Export functionality (CSV)\n- Real-time dashboard\n\n## Bulk Import Format\n\nCSV format for match import:\n```csv\nteam_a,team_b,start_time,tournament,year,venue,match_day\nBrazil,Argentina,2024-06-20 20:00:00,World Cup,2024,Maracana Stadium,1\n```\n\n## Testing\n\n```bash\n# Run tests\npython manage.py test\n\n# Run specific app tests\npython manage.py test users\npython manage.py test predictions\n```\n\n## Deployment\n\n### Environment Variables\n\nSet these in production:\n- `SECRET_KEY` - Django secret key\n- `DEBUG=False` - Disable debug mode\n- `ALLOWED_HOSTS` - Your domain\n- `DB_*` - Database connection\n- `REDIS_URL` - Redis connection\n\n### Production Setup\n\n1. Set `DEBUG=False` in settings\n2. Configure production database\n3. Set up static files serving\n4. Configure Celery for production\n5. Set up SSL certificates\n\n## Contributing\n\n1. Fork the repository\n2. Create a feature branch\n3. Make your changes\n4. Add tests for new functionality\n5. Submit a pull request\n\n## License\n\nThis project is licensed under the MIT License.\n"
  SETUP.md: |
    # Quick Setup Guide

    This guide will help you get the Match Prediction System running quickly.

    ## Prerequisites

    - Python 3.8+
    - PostgreSQL 12+
    - Redis 6+
    - Git

    ## 1. Clone and Setup

    ```bash
    git clone <repository-url>
    cd prediction
    ```

    ## 2. Virtual Environment

    ```bash
    python -m venv venv
    source venv/bin/activate  # On Windows: venv\Scripts\activate
    ```

    ## 3. Install Dependencies

    ```bash
    pip install -r requirements.txt
    ```

    ## 4. Environment Setup

    ```bash
    cp .env.example .env
    ```

    Edit `.env` with your settings:
    ```env
    SECRET_KEY=your-secret-key-here
    DEBUG=True
    DB_NAME=prediction_db
    DB_USER=postgres
    DB_PASSWORD=postgres
    DB_HOST=localhost
    DB_PORT=5432
    REDIS_URL=redis://localhost:6379/0
    ```

    ## 5. Database Setup

    ```bash
    # Create PostgreSQL database
    createdb prediction_db

    # Run migrations
    python manage.py makemigrations
    python manage.py migrate
    ```

    ## 6. Create Admin User

    ```bash
    python manage.py create_admin --username admin --email admin@example.com
    ```

    ## 7. Import Sample Data (Optional)

    ```bash
    # Import sample matches
    python manage.py import_matches sample_data/matches.csv
    ```

    ## 8. Start Services

    ```bash
    # Terminal 1: Start Redis
    redis-server

    # Terminal 2: Start Celery
    celery -A prediction worker --loglevel=info

    # Terminal 3: Start Django
    python manage.py runserver
    ```

    ## 9. Access the Application

    - **API**: http://localhost:8000/api/
    - **Admin Panel**: http://localhost:8000/admin/
    - **API Documentation**: http://localhost:8000/api/docs/

    ## 10. Test the Setup

    ```bash
    # Run tests
    python manage.py test

    # Test specific app
    python manage.py test predictions
    ```

    ## Docker Setup (Alternative)

    ```bash
    # Build and start all services
    docker-compose up --build

    # Create admin user in another terminal
    docker-compose exec web python manage.py create_admin --username admin --email admin@example.com
    ```

    ## Next Steps

    1. **Create regular users** via registration API
    2. **Mark users as paid** via admin panel
    3. **Create tournaments and matches**
    4. **Set up Two-Star configuration**
    5. **Start making predictions!**

    ## Troubleshooting

    ### Database Connection Error
    - Check PostgreSQL is running
    - Verify DB credentials in `.env`
    - Ensure database exists: `createdb prediction_db`

    ### Redis Connection Error
    - Check Redis is running: `redis-server`
    - Verify Redis URL in `.env`

    ### Migration Errors
    - Delete migrations folder and recreate: `python manage.py makemigrations`
    - Check for model conflicts

    ### Permission Errors
    - Ensure admin user has staff/superuser status
    - Check user is marked as `is_paid=True` for predictions

    ## Development Tips

    - Use `--dry-run` flag for import commands
    - Check API docs at `/api/docs/` for endpoint details
    - Monitor Celery logs for background tasks
    - Use Django admin for quick data entry
  docker-compose.yml: |
    services:
      db:
        image: postgres:15
        environment:
          POSTGRES_DB: prediction_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        volumes:
          - postgres_data:/var/lib/postgresql/data
        ports:
          - "5433:5432"

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"

      web:
        build: .
        volumes:
          - .:/code
        ports:
          - "8000:8000"
        depends_on:
          - db
          - redis
        environment:
          - DEBUG=1
          - DB_HOST=db
          - DB_USER=postgres
          - DB_PASSWORD=postgres
          - DB_NAME=prediction_db
          - REDIS_URL=redis://redis:6379/0
          - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,testserver

      frontend:
        build: ./frontend
        command: npm start
        volumes:
          - ./frontend:/app
          - /app/node_modules
        ports:
          - "3000:3000"
        environment:
          - REACT_APP_API_URL=http://localhost:8000
        depends_on:
          - web

      celery:
        build: .
        command: celery -A prediction worker --loglevel=info
        volumes:
          - .:/code
        depends_on:
          - db
          - redis
        environment:
          - DEBUG=1
          - DB_HOST=db
          - DB_USER=postgres
          - DB_PASSWORD=postgres
          - DB_NAME=prediction_db
          - REDIS_URL=redis://redis:6379/0

    volumes:
      postgres_data:
  entrypoint.sh: |
    #!/bin/bash

    # Wait for PostgreSQL to be ready
    echo "Waiting for PostgreSQL..."
    while ! nc -z db 5432; do
      sleep 0.1
    done
    echo "PostgreSQL is ready!"

    # Wait for Redis to be ready
    echo "Waiting for Redis..."
    while ! nc -z redis 6379; do
      sleep 0.1
    done
    echo "Redis is ready!"

    # Run database migrations
    echo "Running database migrations..."
    python manage.py migrate

    # Create superuser if it doesn't exist
    echo "Creating superuser if needed..."
    python manage.py shell << EOF
    from django.contrib.auth import get_user_model
    User = get_user_model()
    if not User.objects.filter(username='admin').exists():
        User.objects.create_superuser('admin', 'admin@example.com', 'admin123')
        print('Superuser created: admin/admin123')
    else:
        print('Superuser already exists')
    EOF

    # Load master data
    echo "Loading master data..."
    python manage.py load_master_data

    # Collect static files
    echo "Collecting static files..."
    python manage.py collectstatic --noinput

    # Start the Django development server
    echo "Starting Django server..."
    exec python manage.py runserver 0.0.0.0:8000
  manage.py: |
    #!/usr/bin/env python
    """Django's command-line utility for administrative tasks."""
    import os
    import sys


    def main():
        """Run administrative tasks."""
        os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'prediction.settings')
        try:
            from django.core.management import execute_from_command_line
        except ImportError as exc:
            raise ImportError(
                "Couldn't import Django. Are you sure it's installed and "
                "available on your PYTHONPATH environment variable? Did you "
                "forget to activate a virtual environment?"
            ) from exc
        execute_from_command_line(sys.argv)


    if __name__ == '__main__':
        main()
  migration.sql: ""
  proxy_server.py: "#!/usr/bin/env python3\n\"\"\"\nSimple proxy server for football-data.org API\nRun this separately to proxy API calls and avoid CORS issues\n\"\"\"\n\nfrom http.server import HTTPServer, BaseHTTPRequestHandler\nimport requests\nimport json\n\nclass ProxyHandler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path.startswith('/api/football/'):\n            # Extract the actual API path\n            api_path = self.path.replace('/api/football/', '')\n            api_url = f'https://api.football-data.org/v4/{api_path}'\n            \n            try:\n                # Add API key header\n                headers = {\n                    'X-Auth-Token': '6afd2c090a1a4454942d3570d86220e7'\n                }\n                \n                # Make the request to football-data.org\n                response = requests.get(api_url, headers=headers)\n                response.raise_for_status()\n                \n                # Send response back to client\n                self.send_response(200)\n                self.send_header('Content-Type', 'application/json')\n                self.send_header('Access-Control-Allow-Origin', '*')\n                self.end_headers()\n                \n                self.wfile.write(response.content)\n                \n            except requests.exceptions.RequestException as e:\n                self.send_response(500)\n                self.send_header('Content-Type', 'application/json')\n                self.send_header('Access-Control-Allow-Origin', '*')\n                self.end_headers()\n                \n                error_response = {\n                    'error': 'Failed to fetch from football-data.org',\n                    'message': str(e)\n                }\n                self.wfile.write(json.dumps(error_response).encode())\n        else:\n            self.send_response(404)\n            self.end_headers()\n    \n    def do_OPTIONS(self):\n        # Handle preflight requests\n        self.send_response(200)\n        self.send_header('Access-Control-Allow-Origin', '*')\n        self.send_header('Access-Control-Allow-Methods', 'GET, OPTIONS')\n        self.send_header('Access-Control-Allow-Headers', 'Content-Type')\n        self.end_headers()\n\nif __name__ == '__main__':\n    server_address = ('', 3002)\n    httpd = HTTPServer(server_address, ProxyHandler)\n    print(\"Proxy server running on http://localhost:3002\")\n    print(\"Access football-data.org API via: http://localhost:3002/api/football/...\")\n    httpd.serve_forever()\n"
