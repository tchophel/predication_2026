apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: celery
  name: celery
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: celery
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: celery
    spec:
      containers:
        - args:
            - celery
            - -A
            - prediction
            - worker
            - --loglevel=info
          env:
            - name: DOCKER_ENV
              value: "1"
            - name: DB_HOST
              value: db
            - name: DB_NAME
              value: prediction_db
            - name: DB_PORT
              value: "5432"
            - name: DB_PASSWORD
              value: postgres
            - name: DB_USER
              value: postgres
            - name: DEBUG
              value: "1"
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: WC2026_API_KEY
              value: wc26_7vVxTuYKTahxxVvu3w6vE5
            - name: WC2026_API_URL
              value: https://api.wc2026api.com
          image: 11104002818/tchophel:v15
          imagePullPolicy: IfNotPresent
          name: celery
      restartPolicy: Always
