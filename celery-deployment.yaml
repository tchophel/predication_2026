apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: celery
  name: celery
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: celery
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: celery
    spec:
      containers:
        - args:
            - celery
            - -A
            - prediction
            - worker
            - --loglevel=info
          env:
            - name: DB_HOST
              value: db
            - name: DB_NAME
              value: prediction_db
            - name: DB_PASSWORD
              value: postgres
            - name: DB_USER
              value: postgres
            - name: DEBUG
              value: "1"
            - name: REDIS_URL
              value: redis://redis:6379/0
          image: celery
          name: celery
          volumeMounts:
            - mountPath: /code
              name: celery-cm0
      restartPolicy: Always
      volumes:
        - configMap:
            name: celery-cm0
          name: celery-cm0
